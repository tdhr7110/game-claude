name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/chimera-battle-prototype-36bome
  workflow_dispatch: {}

# 同時デプロイを1本化する（同じPagesへの競合デプロイを防ぐ）
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 第1回アップデートのテスト版を /test/ サブパスに同梱し、正式版はそのまま配信する。
      # テスト版の取得に失敗しても正式版のデプロイ自体は継続させる（continue-on-error）。
      - name: Checkout test branch (アップデート検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test/chimera-butcher-update-1
          path: test-branch

      - name: Build test branch into /test/ subpath
        if: hashFiles('test-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test-branch
          npm ci
          npm run build -- --base=/game-claude/test/
          mkdir -p ../dist/test
          cp -r dist/. ../dist/test/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
