name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/chimera-battle-prototype-36bome
  workflow_dispatch: {}

# 同時デプロイを1本化する（同じPagesへの競合デプロイを防ぐ）
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 第1回アップデートのテスト版を /test/ サブパスに同梱し、正式版はそのまま配信する。
      # テスト版の取得に失敗しても正式版のデプロイ自体は継続させる（continue-on-error）。
      - name: Checkout test branch (アップデート検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test/chimera-butcher-update-1
          path: test-branch

      - name: Build test branch into /test/ subpath
        if: hashFiles('test-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test-branch
          npm ci
          npm run build -- --base=/game-claude/test/
          mkdir -p ../dist/test
          cp -r dist/. ../dist/test/

      # フェーズ2（TEST2: オートバトル+コマンド・敵ギミック検証版）を /test2/ サブパスに同梱する。
      # TEST1・正式版とは完全に独立したブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test2 branch (フェーズ2検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test2/chimera-butcher-phase2
          path: test2-branch

      - name: Build test2 branch into /test2/ subpath
        if: hashFiles('test2-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test2-branch
          npm ci
          npm run build -- --base=/game-claude/test2/
          mkdir -p ../dist/test2
          cp -r dist/. ../dist/test2/

      # フェーズ3（TEST3: キャラクター可視化・アニメーション・戦闘演出検証版）を /test3/ サブパスに同梱する。
      # TEST1・TEST2・正式版とは完全に独立したブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test3 branch (フェーズ3検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test3/chimera-butcher-phase3
          path: test3-branch

      - name: Build test3 branch into /test3/ subpath
        if: hashFiles('test3-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test3-branch
          npm ci
          npm run build -- --base=/game-claude/test3/
          mkdir -p ../dist/test3
          cp -r dist/. ../dist/test3/

      # フェーズ4（TEST4: ポップUI・ゲームデザイン刷新検証版）を /test4/ サブパスに同梱する。
      # TEST1・TEST2・TEST3・正式版とは完全に独立したブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test4 branch (フェーズ4検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test4/chimera-butcher-phase4
          path: test4-branch

      - name: Build test4 branch into /test4/ subpath
        if: hashFiles('test4-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test4-branch
          npm ci
          npm run build -- --base=/game-claude/test4/
          mkdir -p ../dist/test4
          cp -r dist/. ../dist/test4/

      # フェーズ5（TEST5: ターン制コマンドバトル検証版）を /test5/ サブパスに同梱する。
      # TEST1〜4・正式版とは完全に独立したブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test5 branch (フェーズ5検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test5/chimera-butcher-turn-battle
          path: test5-branch

      - name: Build test5 branch into /test5/ subpath
        if: hashFiles('test5-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test5-branch
          npm ci
          npm run build -- --base=/game-claude/test5/
          mkdir -p ../dist/test5
          cp -r dist/. ../dist/test5/

      # フェーズ6（TEST6: 代謝ゲージ駆動コマンドシステム検証版）を /test6/ サブパスに同梱する。
      # TEST1〜5・正式版とは完全に独立したブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test6 branch (フェーズ6検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test6/chimera-butcher-command-system
          path: test6-branch

      - name: Build test6 branch into /test6/ subpath
        if: hashFiles('test6-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test6-branch
          npm ci
          npm run build -- --base=/game-claude/test6/
          mkdir -p ../dist/test6
          cp -r dist/. ../dist/test6/

      # フェーズ10（TEST10: TEST7〜9統合版。敵候補選択・敵固有ギミック・セーブ再開・図鑑・
      # 戦闘演出/SEを統合）を /test10/ サブパスに同梱する。TEST1〜6・正式版とは完全に独立した
      # ブランチで、取得・ビルドに失敗しても他のデプロイは継続する。
      - name: Checkout test10 branch (統合検証用)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: test10/chimera-integrated-next
          path: test10-branch

      - name: Build test10 branch into /test10/ subpath
        if: hashFiles('test10-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd test10-branch
          npm ci
          npm run build -- --base=/game-claude/test10/
          mkdir -p ../dist/test10
          cp -r dist/. ../dist/test10/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
