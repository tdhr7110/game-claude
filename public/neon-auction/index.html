<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEON AUCTION</title><style>
:root{--bg:#0b0d10;--s:#14181d;--t:#e7ecef;--m:#87919b;--a:#d7ff3f;--d:#ff4d67}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));max-width:760px;margin:auto}.top,.bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:var(--m)}.money{font-variant-numeric:tabular-nums;color:var(--t);font-weight:700}.panel{min-height:0;border:1px solid #252b31;background:linear-gradient(180deg,#101318,#0d1014);padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px}.tag{font-size:11px;letter-spacing:.18em;color:var(--a)}h1,h2,p{margin:0}h1{font-size:clamp(24px,7vw,42px);line-height:1;letter-spacing:-.03em}h2{font-size:clamp(18px,5vw,28px)}.desc{font-size:13px;color:var(--m);line-height:1.5}.bid{align-self:center;text-align:center}.bid small{display:block;color:var(--m);letter-spacing:.18em;font-size:10px}.num{font:700 clamp(44px,13vw,80px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.range{font:600 14px ui-monospace,monospace;color:var(--m)}.npcs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.npc{border-top:1px solid #252b31;padding-top:7px;font-size:11px}.npc b{display:block;color:var(--t);font-size:12px}.npc span{color:var(--m)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button,.choice{border:1px solid #343b43;background:transparent;color:var(--t);padding:12px 4px;min-height:44px}.actions button:active,.choice:active{border-color:var(--a);color:var(--a)}.actions .primary{background:var(--a);color:#0a0b0c;border-color:var(--a);font-weight:800}.shop{display:grid;gap:8px;align-self:center}.choice{text-align:left;padding:12px}.choice b{display:block}.choice small{color:var(--m)}.result{text-align:center;align-self:center}.result .num{color:var(--a)}.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:#0b0d10e8;border:1px solid var(--a);padding:14px 22px;color:var(--a);font-weight:800;letter-spacing:.2em;opacity:0;pointer-events:none;transition:.16s}.toast.show{opacity:1}.tiny{font-size:11px;color:var(--m)}@media(max-height:650px){#app{gap:6px;padding-top:8px;padding-bottom:8px}.panel{padding:10px;gap:8px}.actions button{padding:8px 2px}.num{font-size:clamp(36px,10vh,58px)}}
</style></head><body><div id="app"><div class="top"><span>NEON AUCTION // PRIVATE TERMINAL</span><span class="money" id="money">1200 CR</span></div><main class="panel" id="panel"></main><div class="bottom"><span id="round">ROUND 01/10</span><span id="assets">ASSET 0</span></div></div><div class="toast" id="toast">SOLD</div><script>
const ITEMS=[['違法人格バックアップ','DATA','消された人格の完全複製。',220,640],['旧世代軍用AIコア','TECHNOLOGY','都市戦用推論核。起動記録なし。',350,720],['人工記憶「1987 夏」','ART','誰の記憶かは記録されていない。',180,520],['月面都市永久所有証書','RELIC','法的効力は現在も不明。',420,900],['遺伝子改造された黒い鯉','BIO','光を吸収する皮膚を持つ。',240,600],['警察ドローン中枢','TECHNOLOGY','封印済み追跡AIを含む。',260,660],['旧東京地下鉄 最終切符','RELIC','閉鎖前夜に発行された一枚。',140,480],['未公開脳波広告モデル','DATA','意思決定の0.8秒前を予測。',300,780],['放射線で変色する絵画','ART','作者名は黒塗り。',200,560],['培養心臓 prototype 09','BIO','所有権に関する訴訟中。',280,690],['軍用義眼 XR-0','ILLEGAL','対象識別規制を解除済み。',320,760],['暗号化された皇室AIログ','DATA','閲覧キーは存在しない。',400,980],['軌道エレベータ破片','RELIC','事故現場から回収。',170,510],['自己修復ナノ皮膚','TECHNOLOGY','治験中止理由は非公開。',330,820],['夢を記録するカセット','ART','再生機器は現存しない。',160,540],['火星産の無菌苔','BIO','地球環境でのみ発光する。',210,580],['企業戦争停戦鍵','RELIC','一度だけ使われた署名鍵。',380,900],['感情削除パッチ','ILLEGAL','違法医療市場で流通。',230,710],['死者の位置情報履歴','DATA','対象者47万人分。',290,740],['試作反重力ローター','TECHNOLOGY','連続運転時間11秒。',360,860]];
const SHOP=[['OPTIC SCANNER',300,'推定価格幅を25%狭める','scan'],['PREDICTION CHIP',260,'NPCの熱量を表示','pred'],['DEEP SCAN',360,'真価を2回だけ確認','deep'],['BLACK LEDGER',240,'以後ショップ価格-20%','disc'],['MARKET EYE',220,'次カテゴリを先読み','eye'],['SOCIAL HACK',280,'NPC最大入札額-10%','hack']];
let state={round:1,money:1200,owned:[],up:[],deep:0,item:null,bid:0,active:true};const $=s=>document.querySelector(s),panel=$('#panel');function pick(){const a=ITEMS[Math.floor(Math.random()*ITEMS.length)];const trueV=Math.floor(a[3]+Math.random()*(a[4]-a[3]));let low=a[3],high=a[4];if(state.up.includes('scan')){let mid=(low+high)/2,w=(high-low)*.375;low=Math.round(mid-w);high=Math.round(mid+w)}state.item={a,trueV,low,high};state.bid=Math.max(20,Math.round(low*.35/10)*10);state.active=true;renderAuction()}function npcCaps(){let base=state.item.trueV;return [base*(.75+Math.random()*.45),base*(.55+Math.random()*.30),base*(.65+Math.random()*.65)].map(x=>state.up.includes('hack')?x*.9:x)}function renderAuction(){const [name,cat,desc]=state.item.a;let deep=state.deep>0?`<button class="choice" onclick="reveal()">DEEP SCAN <small>${state.deep} USE</small></button>`:'';panel.innerHTML=`<div class="tag">${cat}</div><div><h1>${name}</h1><p class="desc">${desc}</p></div><div class="bid"><small>CURRENT BID</small><div class="num">${state.bid}</div><div class="range">EST. ${state.item.low}—${state.item.high} CR</div></div><div><div class="npcs"><div class="npc"><b>COLLECTOR</b><span>${state.up.includes('pred')?'HIGH INTEREST':'ACTIVE'}</span></div><div class="npc"><b>SHARK</b><span>VALUE ONLY</span></div><div class="npc"><b>GAMBLER</b><span>UNSTABLE</span></div></div><div class="actions" style="margin-top:10px"><button onclick="bid(10)">+10</button><button onclick="bid(50)">+50</button><button onclick="bid(100)">+100</button><button class="primary" onclick="passBid()">PASS</button></div>${deep}</div>`;sync()}function bid(n){if(!state.active||state.money<state.bid+n)return flash('INSUFFICIENT CREDIT');state.bid+=n;let max=Math.max(...npcCaps());if(max>state.bid&&Math.random()<.75){state.bid+=[10,20,50][Math.floor(Math.random()*3)];renderAuction()}else win()}function passBid(){if(!state.active)return;state.active=false;flash('PASSED');setTimeout(nextRound,550)}function win(){if(state.bid>state.money)return flash('INSUFFICIENT CREDIT');state.active=false;state.money-=state.bid;state.owned.push({...state.item,paid:state.bid});flash('SOLD');setTimeout(nextRound,650)}function reveal(){if(state.deep<1)return;state.deep--;flash(`TRUE VALUE ${state.item.trueV}`);renderAuction()}function nextRound(){if(state.round>=10)return finish();state.round++;if([4,7,10].includes(state.round))return renderShop();pick()}function renderShop(){let picks=[...SHOP].sort(()=>Math.random()-.5).slice(0,3);panel.innerHTML=`<div class="tag">CYBER SHOP</div><div><h2>UPGRADE YOUR EDGE</h2><p class="desc">資産ではなく、あなた自身の情報優位を購入する。</p></div><div class="shop">${picks.map(x=>`<button class="choice" onclick="buyShop(${SHOP.indexOf(x)})"><b>${x[0]} — ${shopPrice(x[1])} CR</b><small>${x[2]}</small></button>`).join('')}</div><button class="choice" onclick="skipShop()">SKIP</button>`;sync()}function shopPrice(p){return Math.round(p*(state.up.includes('disc')?.8:1)/10)*10}function buyShop(i){let x=SHOP[i],p=shopPrice(x[1]);if(state.money<p)return flash('INSUFFICIENT CREDIT');state.money-=p;if(!state.up.includes(x[3]))state.up.push(x[3]);if(x[3]==='deep')state.deep+=2;flash('INSTALLED');setTimeout(()=>{if(state.round>=10)finish();else pick()},450)}function skipShop(){if(state.round>=10)finish();else pick()}function finish(){let base=state.owned.reduce((s,o)=>s+o.trueV,0),counts={};state.owned.forEach(o=>counts[o.a[1]]=(counts[o.a[1]]||0)+1);let mult=1;Object.values(counts).forEach(c=>{if(c>=3)mult+=.4});if((counts.ILLEGAL||0)>=2)mult+=.6;let total=Math.round(state.money+base*mult);panel.innerHTML=`<div class="tag">FINAL LEDGER</div><div><h2>RUN COMPLETE</h2><p class="desc">地下市場は閉じた。残ったのは数字だけ。</p></div><div class="result"><small class="tiny">NET ASSET VALUE</small><div class="num">${total}</div><p class="tiny">CASH ${state.money} / GOODS ${base} / MULTI ×${mult.toFixed(1)}</p></div><button class="choice" onclick="resetGame()">NEW RUN</button>`;sync()}function resetGame(){state={round:1,money:1200,owned:[],up:[],deep:0,item:null,bid:0,active:true};pick()}function sync(){$('#money').textContent=state.money+' CR';$('#round').textContent=`ROUND ${String(state.round).padStart(2,'0')}/10`;$('#assets').textContent=`ASSET ${state.owned.length}`}function flash(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),420)}pick();
</script></body></html>
